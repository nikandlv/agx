name: Release & Auto-Bump

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'assets/**'
      - '.gitignore'

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      tag_name: ${{ steps.bump.outputs.tag_name }}
      release_body: ${{ steps.changelog.outputs.release_body }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Generate Changelog from Commit Messages
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "Previous tag: $PREV_TAG"

          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"* %s (%h)" --no-merges)
          else
            COMMITS=$(git log -n 15 --pretty=format:"* %s (%h)" --no-merges)
          fi

          # Multiline output handling in GitHub Actions
          {
            echo "release_body<<EOF"
            echo "### What's Changed"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "---"
            echo "Automated release build for **agx**."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Auto-bump patch version in Cargo.toml
        id: bump
        run: |
          # Extract current version
          CURRENT_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Current version: $CURRENT_VERSION"

          # Increment patch version (major.minor.patch)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"

          # Update Cargo.toml
          sed -i "s/^version = \"$CURRENT_VERSION\"/version = \"$NEW_VERSION\"/" Cargo.toml

          # Update Cargo.lock if cargo is present
          if command -v cargo &> /dev/null; then
            cargo check --quiet || true
          fi

          # Git commit and push updated version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): bump version to v${NEW_VERSION} [skip ci]" || echo "No changes to commit"
          git push origin main

          # Create git tag
          TAG_NAME="v${NEW_VERSION}"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

  build-release:
    needs: bump-version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: agx
            asset_name: agx-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: agx
            asset_name: agx-aarch64-apple-darwin.tar.gz

    steps:
      - name: Checkout tagged code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.tag_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build target binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.asset_name }} ${{ matrix.binary_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  publish-github-release:
    needs: [bump-version, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version.outputs.tag_name }}
          name: Release ${{ needs.bump-version.outputs.tag_name }}
          body: ${{ needs.bump-version.outputs.release_body }}
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
